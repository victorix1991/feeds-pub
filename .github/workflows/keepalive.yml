name: keepalive
# GitHub pauses scheduled workflows after 60 days without repository activity; one tiny commit a month prevents that.
on:
  schedule:
    - cron: "11 3 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%F > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive && git commit -m "keepalive" && git push
