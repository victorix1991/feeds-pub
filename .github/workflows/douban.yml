name: douban
# Every 3 hours (dispatched by the status hub): build the Douban recommend bundle for the TVBox T4 page.
# Commits douban/bundle.json only when validation passes and content changed; then purges jsDelivr.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: douban
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        id: gen
        run: python3 douban_gen.py douban/bundle.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add douban/bundle.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "douban: ${{ steps.gen.outputs.note }}"
          git push -q
      - name: Purge jsDelivr cache
        continue-on-error: true
        run: |
          for p in "feeds-pub@main/douban/bundle.json" "feeds-pub/douban/bundle.json"; do
            c=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "https://purge.jsdelivr.net/gh/victorix1991/$p"); echo "purge $p $c"
          done
